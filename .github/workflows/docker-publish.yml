# ==============================================================================
# PIPELINE CI/CD - CONSTRUCCIÓN Y PUBLICACIÓN EN DOCKERHUB (D3, D6)
# ==============================================================================
# Se dispara tras el éxito de los tests o mediante tags de versión.
# Asocia el commit SHA y tag de versión a la imagen publicada en DockerHub.
# ==============================================================================

name: CD - Build & Push DockerHub

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

jobs:
  build-and-push:
    name: Build & Push Images
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Iniciar sesión en DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extraer metadatos para Backend (Tags & Labels)
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/banco-backend
          tags: |
            type=sha,format=short,prefix=sha-
            type=raw,value=latest
            type=ref,event=tag

      - name: Compilar y Publicar Imagen Backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}

      - name: Extraer metadatos para Frontend (Tags & Labels)
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/banco-frontend
          tags: |
            type=sha,format=short,prefix=sha-
            type=raw,value=latest
            type=ref,event=tag

      - name: Compilar y Publicar Imagen Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}

