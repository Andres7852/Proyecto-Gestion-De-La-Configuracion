apiVersion: v1
kind: ConfigMap
metadata:
  name: banco-backend-config
  namespace: banco-mvp
data:
  PORT: "3000"
  NODE_ENV: "production"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: banco-backend
  namespace: banco-mvp
  labels:
    app: banco-backend
    tier: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: banco-backend
  template:
    metadata:
      labels:
        app: banco-backend
        tier: api
    spec:
      containers:
        - name: backend
          # Esta imagen será construida y publicada en DockerHub por el Compañero 2
          image: andres7887/banco-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
              name: http
          envFrom:
            - configMapRef:
                name: banco-backend-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: banco-db-secret
                  key: DATABASE_URL
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: banco-db-secret
                  key: JWT_SECRET
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "300m"
          livenessProbe:
            httpGet:
              path: /api-docs.json
              port: 3000
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api-docs.json
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
---
apiVersion: v1
kind: Service
metadata:
  name: banco-backend-svc
  namespace: banco-mvp
spec:
  type: NodePort
  ports:
    - port: 3000
      targetPort: 3000
      nodePort: 30080
      name: http
  selector:
    app: banco-backend
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: banco-mvp
spec:
  type: ClusterIP
  ports:
    - port: 3000
      targetPort: 3000
      name: http
  selector:
    app: banco-backend
